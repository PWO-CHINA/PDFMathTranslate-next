name: Security compatibility contract

on:
  push:
    branches:
      - maintenance/v2.10.2-security-20261116
      - fix/pillow13-upstream-20261116
  pull_request:
    branches:
      - maintenance/v2.10.2-security-20261116

permissions:
  contents: read

jobs:
  synthetic-contract:
    if: github.repository == 'PWO-CHINA/PDFMathTranslate-next'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HF_HUB_OFFLINE: '1'
      GRADIO_ANALYTICS_ENABLED: 'False'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked out revision
        run: if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Unexpected checkout revision' }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install reviewed dependency contract
        run: python -m pip install -e . 'Pillow==13.0.0'
      - name: Check dependency consistency
        run: python -m pip check
      - name: Exercise synthetic contract without external connections
        run: python tests/security_contract.py
