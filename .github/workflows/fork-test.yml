name: fork-test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  REPO_LOWER: ${{ github.repository_owner }}/${{ github.event.repository.name }}
  GHCR_REPO: ghcr.io/${{ github.repository }}
  WIN_EXE_PYTHON_VERSION: 3.13.3
jobs:
  check-repository:
    name: Check if running in main repository
    runs-on: ubuntu-latest
    outputs:
      is_main_repo: ${{ github.repository == 'PDFMathTranslate-next/PDFMathTranslate-next' }}
    steps:
      - run: echo "Running repository check"

  test:
    uses: ./.github/workflows/python-test.yml
    needs: check-repository
    if: needs.check-repository.outputs.is_main_repo != 'true' && github.repository != 'PWO-CHINA/PDFMathTranslate-next'

  cross-page-contract:
    if: github.repository == 'PWO-CHINA/PDFMathTranslate-next'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install adapter and baseline engine
        run: python -m pip install -e . "BabelDOC==0.7.1" "pytest==8.4.2"
      - name: Check unsupported baseline engine
        run: python -c "from pdf2zh_next.high_level import supports_experimental_cross_page_context as supported; assert not supported()"
      - name: Test cross-page public contract without a provider
        run: python -m pytest -q tests/test_cross_page_setting.py
      - name: Install hash-pinned experimental engine
        run: python -m pip install --no-deps --force-reinstall "https://github.com/PWO-CHINA/BabelDOC/releases/download/pwo-0.7.1.2-crosspage.20-bca9e921/babeldoc-0.7.1%2Bpwo.2.crosspage.20.bca9e921-cp310-abi3-win_amd64.whl#sha256=f70bc6d1a243e26eac2b4a063789bbe226c9289e98cdd00b11a2140d2ff8a202"
      - name: Check released engine compatibility
        run: |
          python -c "import hashlib; from pathlib import Path; from babeldoc import _rust_il; from babeldoc.format.pdf import translation_config; from pdf2zh_next.config.model import TranslationSettings; from pdf2zh_next.high_level import supports_experimental_cross_page_context as supported; markers = (translation_config.CROSS_PAGE_SENTENCE_PROTOCOL_VERSION, _rust_il.CROSS_PAGE_SENTENCE_PROTOCOL_VERSION); assert all(type(value) is int and value == 1 for value in markers); assert supported() is True; assert TranslationSettings().experimental_cross_page_context is False; assert _rust_il.stage_capture_enabled() is False; assert hashlib.sha256(Path(_rust_il.__file__).read_bytes()).hexdigest() == '6afb1498d248fa05043513fb0b5bf2c7dfa22458893298066f60247371a0cf31'"
